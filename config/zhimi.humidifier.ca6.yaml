# https://home.miot-spec.com/spec/zhimi.humidifier.ca6

external_components:
  source: github://dhewg/esphome-miot@main

esphome:
  name: humidifier
  friendly_name: Smartmi Evaporative Humidifier 3
  comment: Smartmi Evaporative Humidifier 3 (zhimi.humidifier.ca6)
  project:
    name: "dhewg.esphome-miot"
    version: "zhimi.humidifier.ca6"

esp32:
  board: esp32doit-devkit-v1
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_FREERTOS_UNICORE: y
    advanced:
      ignore_efuse_custom_mac: true
      ignore_efuse_mac_crc: true

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s
  services:
    - service: mcu_command
      variables:
        command: string
      then:
        - lambda: 'id(miot_main).queue_command(command);'

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    password: !secret wifi_ap_password

captive_portal:

uart:
  #TODO: confirm gpios after opening the case
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 115200

miot:
  id: miot_main

binary_sensor:
  - platform: "miot"
    miot_siid: 7
    miot_piid: 7
    id: pump_state
    name: "Pump state"
    device_class: running
    icon: mdi:water-pump
    entity_category: diagnostic

button:
  - platform: "miot"
    miot_siid: 2
    miot_aiid: 1
    id: toggle
    name: "Power Toggle"
  - platform: "miot"
    miot_siid: 7
    miot_aiid: 1
    id: toggle_mode
    name: "Mode Toggle"

fan:
  - platform: "miot"
    name: "Fan"
    state:
      miot_siid: 2
      miot_piid: 1
    speed:
      miot_siid: 2
      miot_piid: 5
      min_value: 0
      max_value: 3

number:
  - platform: "miot"
    miot_siid: 2
    miot_piid: 6
    id: target_humidity
    name: "Target Humidity"
    icon: mdi:water-percent
    entity_category: config
    min_value: 30
    max_value: 60
    step: 1

select:
  - platform: "miot"
    miot_siid: 2
    miot_piid: 5
    id: fan_level
    name: "Fan Level"
    icon: mdi:fan
    entity_category: config
    options:
      0: "Favourite"
      1: "Auto"
      2: "Sleep"
  - platform: "miot"
    miot_siid: 5
    miot_piid: 2
    id: brightness
    name: "Display Brightness"
    icon: mdi:brightness-6
    entity_category: config
    options:
      0: "Dark"
      1: "Glimmer"
      2: "Brightest"
  - platform: "miot"
    miot_siid: 7
    miot_piid: 4
    id: country_code
    name: "Country Code"
    icon: mdi:flag-variant
    entity_category: config
    options:
      44: "EU"
      81: "JP"
      82: "KR"
      86: "CH"
      886: "TW"

sensor:
  - platform: "miot"
    miot_siid: 1
    miot_piid: 1
    id: manufacturer
    name: "Device Manufacturer"
  - platform: "miot"
    miot_siid: 1
    miot_piid: 2
    id: model
    name: "Device Model"
  - platform: "miot"
    miot_siid: 1
    miot_piid: 3
    id: serial_number
    name: "Device ID"
  - platform: "miot"
    miot_siid: 1
    miot_piid: 4
    id: firmware_revision
    name: "Current Firmware Version"
  - platform: "miot"
    miot_siid: 1
    miot_piid: 5
    id: serial_no
    name: "Serial Number"
  - platform: "miot"
    miot_siid: 2
    miot_piid: 2
    id: fault
    name: "Device Fault Code"
    icon: mdi:fan-alert
    entity_category: diagnostic
  - platform: "miot"
    miot_siid: 2
    miot_piid: 7
    id: water_level
    name: "Water Level"
    device_class: measurement
    icon: mdi:water-check
    filter:
      map:
        - 0 -> "Empty"
        - 1 -> "Normal"
        - 2 -> "Full"
  - platform: "miot"
    miot_siid: 2
    miot_piid: 9
    id: status
    name: "Status"
    filter:
      map:
        - 1 -> "Close"
        - 2 -> "Work"
        - 3 -> "Dry"
        - 4 -> "Clean"
    #TODO: might not be used
  - platform: "miot"
    miot_siid: 2
    miot_piid: 11
    name: "Motor Speed"
    unit_of_measurement: "rpm"
    icon: mdi:fan
  - platform: "miot"
    miot_siid: 3
    miot_piid: 7
    id: temperature
    name: "Temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: "measurement"
    icon: mdi:thermometer
  - platform: "miot"
    miot_siid: 3
    miot_piid: 9
    name: "Relative Humidity"
    unit_of_measurement: "%"
    device_class: humidity
    state_class: "measurement"
    icon: mdi:water-percent
  # - platform: "miot"
  #   miot_siid: 7
  #   miot_piid: 1
  #   id: actual_speed
  #   name: "Actual Speed"
  #   unit_of_measurement: "rpm"
  #   icon: mdi:fan
  - platform: "miot"
    miot_siid: 7
    miot_piid: 6
    id: self_clean_percent
    name: "Self-clean progress"
    unit_of_measurement: "min"
    #TODO: scale 0-30, might translate to %
    device_class: "duration"
    state_class: "measurement"
    icon: mdi:progress-clock
  - platform: "miot"
    miot_siid: 7
    miot_piid: 8
    id: pump_cnt
    name: "Pump count"
    state_class: "total_increasing"
    icon: mdi:counter

switch:
  # - platform: miot
  #   id: on
  #   name: Switch Status
  #   miot_siid: 2
  #   miot_piid: 1
  - platform: "miot"
    miot_siid: 2
    miot_piid: 8
    id: automatic_air_drying
    name: "Air Drying"
    icon: mdi:water-minus
    entity_category: config
  - platform: "miot"
    miot_siid: 4
    miot_piid: 1
    id: alarm
    name: "Notification Sounds"
    icon: mdi:volume-high
    entity_category: config
  - platform: "miot"
    miot_siid: 6
    miot_piid: 1
    id: physical_controls_locked
    name: "Child Lock"
    icon: mdi:lock
    entity_category: config
  - platform: "miot"
    miot_siid: 7
    miot_piid: 5
    id: clean
    name: "Clean Mode"
    icon: mdi:shimmer
    entity_category: config
