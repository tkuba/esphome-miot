# https://home.miot-spec.com/spec/zhimi.humidifier.ca6

external_components:
  source: github://dhewg/esphome-miot@main

esphome:
  name: humidifier
  friendly_name: Air Humidifier
  comment: Smartmi Evaporative Humidifier 3 (zhimi.humidifier.ca6)
  project:
    name: "dhewg.esphome-miot"
    version: "zhimi.humidifier.ca6"

esp32:
  board: esp32doit-devkit-v1
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_FREERTOS_UNICORE: y
    advanced:
      ignore_efuse_custom_mac: true
      ignore_efuse_mac_crc: true

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s
  services:
    - service: mcu_command
      variables:
        command: string
      then:
        - lambda: 'id(miot_main).queue_command(command);'

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    password: !secret wifi_ap_password

captive_portal:

uart:
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 115200

miot:
  id: miot_main

fan:
  - platform: "miot"
    name: "Fan"
    state:
      miot_siid: 2
      miot_piid: 1
    speed:
      miot_siid: 2
      miot_piid: 5
      min_value: 0
      max_value: 3

switch:
  - platform: "miot"
    miot_siid: 2
    miot_piid: 8
    name: "Air Drying"
    icon: mdi:water-minus
    entity_category: config
  - platform: "miot"
    miot_siid: 4
    miot_piid: 1
    name: "Notification Sounds"
    icon: mdi:volume-high
    entity_category: config
  - platform: "miot"
    miot_siid: 6
    miot_piid: 1
    name: "Child Lock"
    icon: mdi:lock
    entity_category: config
  - platform: "miot"
    miot_siid: 7
    miot_piid: 5
    name: "Clean Mode"
    icon: mdi:water-minus
    entity_category: config
#TODO: 
#- target humidity
#

select:
  - platform: "miot"
    miot_siid: 2
    miot_piid: 5
    name: "Mode"
    #TODO: change icon
    icon: mdi:brightness-6
    entity_category: config
    options:
      0: "Favourite"
      1: "Auto"
      2: "Sleep"
  - platform: "miot"
    miot_siid: 5
    miot_piid: 2
    name: "Display brightness"
    icon: mdi:brightness-6
    entity_category: config
    options:
      0: "Off"
      1: "Dim"
      2: "Brightest"

sensor:
  - platform: internal_temperature
    name: "MCU Temperature"
  - platform: "miot"
    miot_siid: 2
    miot_piid: 2
    name: "Device Fault Code"
    icon: mdi:fan-alert
    entity_category: diagnostic
  - platform: "miot"
    miot_siid: 2
    miot_piid: 7
    name: "Water Level"
    #TODO: change icon, confirm options
    device_class: measurement
    icon: mdi:water-check
    entity_category: diagnostic
    options:
      0: "Empty"
      1: "Normal"
      2: "Full"
  - platform: "miot"
    miot_siid: 2
    miot_piid: 9
    name: "Status"
    #TODO: change icon, confirm options
    icon: mdi:water-percent
    options:
      1: "Close"
      2: "Work"
      3: "Dry"
      4: "Clean"
    #TODO: might not be used
  - platform: "miot"
    miot_siid: 2
    miot_piid: 11
    name: "Motor Speed"
    unit_of_measurement: "rpm"
    icon: mdi:fan
  - platform: "miot"
    miot_siid: 3
    miot_piid: 7
    name: "Temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: "measurement"
    icon: mdi:thermometer
  - platform: "miot"
    miot_siid: 3
    miot_piid: 9
    name: "Humidity"
    unit_of_measurement: "%"
    device_class: humidity
    state_class: "measurement"
    icon: mdi:water-percent
  - platform: "miot"
    miot_siid: 7
    miot_piid: 1
    name: "Actual Speed"
    unit_of_measurement: "rpm"
    icon: mdi:fan
  - platform: "miot"
    miot_siid: 7
    miot_piid: 4
    name: "Country Code"
    #TODO: change icon, confirm options
    icon: mdi:fan
    options:
      44: "EU"
      81: "JP"
      82: "KR"
      86: "CH"
      886: "TW"
  - platform: "miot"
    miot_siid: 7
    miot_piid: 5
    name: "Clean mode"
    icon: mdi:shimmer
    entity_category: config
  - platform: "miot"
    miot_siid: 7
    miot_piid: 6
    name: "Self-clean progress"
    unit_of_measurement: "min"
    #TODO: change device class, icon, scale 0-30, might translate to %
    device_class: humidity
    state_class: "measurement"
    icon: mdi:fan
  - platform: "miot"
    miot_siid: 7
    miot_piid: 7
    name: "Pump state"
    #TODO: change icon
    icon: mdi:fan
  - platform: "miot"
    miot_siid: 7
    miot_piid: 8
    name: "Pump count"
    #TODO: change icon
    state_class: "measurement"
    icon: mdi:fan
